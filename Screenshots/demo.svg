<text x="16" y="500" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">isolated&#160;user&#160;name&#160;&#160;&#160;&#160;balancedIsolate&#160;&#160;&#160;&#160;&#160;unchanged&#160;&#160;18&#160;-&gt;&#160;16&#160;characters,&#160;18&#160;-&gt;&#160;16&#160;scalars</text>
<text x="16" y="518" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">CJK&#160;variant&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;variationSequence&#160;&#160;&#160;unchanged&#160;&#160;14&#160;-&gt;&#160;14&#160;characters,&#160;15&#160;-&gt;&#160;14&#160;scalars</text>
<text x="16" y="536" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="554" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">standard&#160;policy&#160;left&#160;13&#160;of&#160;13&#160;unchanged&#160;and&#160;found&#160;nothing&#160;suspicious</text>
<text x="16" y="572" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">stripping&#160;every&#160;hidden&#160;scalar&#160;changed&#160;13&#160;of&#160;13</text>
<text x="16" y="590" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">the&#160;Scotland&#160;flag's&#160;tags&#160;decode&#160;to&#160;"gbsct";&#160;the&#160;run&#160;is&#160;kept&#160;as&#160;a&#160;flag</text>
<text x="16" y="608" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="626" font-family="Menlo,monospace" font-size="12" fill="#d2a8ff">3.&#160;Filters&#160;that&#160;read&#160;hidden&#160;scalars&#160;as&#160;part&#160;of&#160;the&#160;text</text>
<text x="16" y="644" font-family="Menlo,monospace" font-size="12" fill="#d2a8ff">=======================================================</text>
