<text x="16" y="410" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">Devanagari&#160;half-form&#160;&#160;scriptJoiner&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;unchanged&#160;&#160;1&#160;-&gt;&#160;1&#160;characters,&#160;4&#160;-&gt;&#160;3&#160;scalars</text>
