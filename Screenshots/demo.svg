<text x="16" y="824" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;raw&#160;text:&#160;&#160;&#160;&#160;&#160;&#160;"e@example.com"</text>
<text x="16" y="842" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;standard:&#160;&#160;&#160;&#160;&#160;&#160;"e@example.com"</text>
<text x="16" y="860" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;matching&#160;view:&#160;"jane.doe@example.com"</text>
<text x="16" y="878" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="896" font-family="Menlo,monospace" font-size="12" fill="#d2a8ff">4.&#160;A&#160;streamed&#160;answer,&#160;sanitized&#160;as&#160;it&#160;arrives</text>
<text x="16" y="914" font-family="Menlo,monospace" font-size="12" fill="#d2a8ff">=============================================</text>
<text x="16" y="932" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">145&#160;scalars&#160;in&#160;17&#160;chunks&#160;of&#160;9;&#160;released/held&#160;after&#160;each&#160;chunk:</text>
<text x="16" y="950" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;9/0&#160;9/0&#160;6/3&#160;12/0&#160;5/4&#160;0/13&#160;0/22&#160;0/31&#160;0/40&#160;7/0&#160;6/3&#160;12/0&#160;9/0&#160;9/0&#160;9/0&#160;9/0&#160;1/0&#160;</text>
<text x="16" y="968" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">stream&#160;output&#160;equals&#160;whole-text&#160;sanitize:&#160;yes</text>
<text x="16" y="986" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">runs&#160;found&#160;by&#160;the&#160;stream:&#160;5,&#160;by&#160;the&#160;batch&#160;scan:&#160;5,&#160;identical:&#160;yes</text>
