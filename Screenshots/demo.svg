<text x="16" y="1022" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">every&#160;two-chunk&#160;split&#160;of&#160;the&#160;reply:&#160;146&#160;of&#160;146&#160;identical&#160;to&#160;the&#160;batch&#160;result</text>
