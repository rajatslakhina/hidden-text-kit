<text x="16" y="356" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">heart&#160;on&#160;fire&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;emojiJoiner&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;unchanged&#160;&#160;1&#160;-&gt;&#160;2&#160;characters,&#160;4&#160;-&gt;&#160;2&#160;scalars</text>
<text x="16" y="374" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">keycap&#160;one&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;variationSequence&#160;&#160;&#160;unchanged&#160;&#160;1&#160;-&gt;&#160;1&#160;characters,&#160;3&#160;-&gt;&#160;2&#160;scalars</text>
