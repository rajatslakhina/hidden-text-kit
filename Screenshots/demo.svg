<text x="16" y="464" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">soft&#160;hyphens&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;softHyphen&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;unchanged&#160;&#160;18&#160;-&gt;&#160;16&#160;characters,&#160;18&#160;-&gt;&#160;16&#160;scalars</text>
